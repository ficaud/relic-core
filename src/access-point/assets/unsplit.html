<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Relic Core — Unsplit</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="version">v1.7.0</div>
    <div class="card">
        <div class="icon">&#x1F513;</div>
        <h2>Reconstruct Secret</h2>
        <p class="desc">Enter your shares below to reconstruct the original secret using Shamir's Secret Sharing scheme.
        </p>

        <div class="checkbox-row">
            <input type="checkbox" id="bip-compression" class="bip-compression">
            <label for="bip-compression">BIP-39 Compression (<span class="tooltip" data-tooltip="if your secret is a seed phrase (BIP-39)">?</span>)</label>
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="slip-compression" class="bip-compression">
            <label for="slip-compression">SLIP-39 Compression (<span class="tooltip" data-tooltip="if your secret is a mnemonic (SLIP-39)">?</span>)</label>
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="compression-passphrase" class="bip-compression" disabled>
            <label for="compression-passphrase">With passphrase (<span class="tooltip" data-tooltip="if you have a passphrase after your seed phrase or mnemonic (e.g. 'abandon zoo zoo; my_passphrase')">?</span>)</label>
        </div>
        <div id="share-rows">
            <div class="share-row">
                <input type="number" class="x-input" value="1" min="1" max="255" placeholder="x">
                <input type="text" class="d-input" placeholder='Hex data or "x:hex" e.g. 3:60b5b9...'>
                <button class="qr-btn" data-row="0" title="Scan QR code">&#x1F4F7;</button>
            </div>
            <div class="share-row">
                <input type="number" class="x-input" value="2" min="1" max="255" placeholder="x">
                <input type="text" class="d-input" placeholder='Hex data or "x:hex" e.g. 4:1352fb...'>
                <button class="qr-btn" data-row="1" title="Scan QR code">&#x1F4F7;</button>
            </div>
            <div class="share-row">
                <input type="number" class="x-input" value="3" min="1" max="255" placeholder="x">
                <input type="text" class="d-input" placeholder='Hex data or "x:hex" e.g. 5:3aafa8...'>
                <button class="qr-btn" data-row="2" title="Scan QR code">&#x1F4F7;</button>
            </div>
        </div>

        <p class="qr-note">📷 Take a photo of the QR code with your camera, then pick the image (or select
            one from your Photo Library).</p>

        <button id="unsplit-btn" class="msg-btn" style="width:100%;margin-bottom:16px;">Reconstruct</button>

        <div id="result-box" class="hidden" style="margin-bottom:16px;">
            <div class="result-label">Reconstructed secret:</div>
            <div class="result-value" id="result-text"></div>
            <button id="copy-result" class="copy-btn" style="margin-top:6px;">&#x1F4CB; Copy</button>
        </div>

        <a href="index.html" class="back-link">&#8592; Back</a>
        <div id="toast" class="toast">Copied!</div>
    </div>

    <!-- Hidden file input for QR scan (opens the native camera on mobile) -->
    <input type="file" id="qr-file-input" class="qr-file-input" accept="image/*" capture="environment">

    <script src="scripts/unsplit.js?v=7"></script>
</body>

</html>
