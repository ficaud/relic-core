<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Relic Core — Split</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="version">v1.6.1</div>
    <div class="card">
        <div class="icon">&#x1F512;</div>
        <h2>Shamir's Secret Encryption</h2>
        <p class="desc">Enter the secret you wish to encrypt using Shamir's Secret Sharing scheme. Your secret will be
            split into 5 shares. 3 are necessary to reconstruct the secret.</p>
        <div class="checkbox-row">
            <input type="checkbox" id="bip-compression" class="bip-compression">
            <label for="bip-compression">BIP-39 Compression (<span class="tooltip" data-tooltip="if your secret is a seed phrase (BIP-39)">?</span>)</label>
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="bip-passphrase" class="bip-compression" disabled>
            <label for="bip-passphrase">With passphrase (<span class="tooltip" data-tooltip="if you have a passphrase after your seed phrase (e.g. 'abandon zoo zoo; my_passphrase')">?</span>)</label>
        </div>
        <div class="test-box">
            <input type="text" id="msg-input" class="msg-input" placeholder="Enter your secret..." maxlength="256">
            <button id="msg-btn" class="msg-btn">Encrypt</button>
        </div>
        <div id="share-list" class="hidden"></div>
        <a href="index.html" class="back-link">&#8592; Back</a>
        <div id="toast" class="toast">Copied!</div>
        <script src="scripts/split.js?v=4"></script>
    </div>
</body>

</html>
