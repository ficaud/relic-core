# Board-specific Kconfig fragment for the Seeed XIAO ESP32S3 (xiao_esp32s3/esp32s3/procpu).
# Merged after prj.conf by the Zephyr build system.

# The XIAO ESP32S3 is an ESP32-S3 (WROOM N8R8: 8 MB flash + 8 MB PSRAM) with
# the same ~400 KB of app DRAM as the DevKitC-1. On-device QR decoding is
# therefore enabled here, exactly like the esp32s3_devkitc board.
CONFIG_RELIC_QR_DECODE_SERVER=y

# Use ZXing-cpp (QR-only) instead of quirc. Kept behind the backend choice so
# quirc can be re-enabled for comparison/rollback.
CONFIG_RELIC_QR_DECODE_BACKEND_ZXING=y

# The XIAO's 8 MB octal PSRAM is otherwise unused. Route the decoder buffers to
# it so it can decode larger frames than the small internal heap allows.
# 640px on the long side gives ~8 px/module for a ~77-module share QR.
CONFIG_RELIC_QR_DECODE_PSRAM=y
CONFIG_RELIC_QR_DECODE_MAX_DIM=640

# PSRAM support (N8R8 => octal PSRAM). The grayscale buffer + ZXing's BitMatrix
# for a 640x640 frame total ~2 MB; reserve 4 MB of the 8 MB for the multi-heap.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_SPIRAM_HEAP_SIZE=4194304

# C++ runtime required by ZXing-cpp (the firmware is otherwise C). picolibc is
# already the libc, so the full C++ stdlib (libstdc++) + exceptions are the only
# additions. The classic ESP32 (DevKit V1) does NOT enable this.
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y

# ---------------------------------------------------------------------------
# WiFi RX/TX buffer tuning
# ---------------------------------------------------------------------------
# Same rationale as the esp32s3_devkitc board fragment: the ESP32 WiFi driver
# allocates its buffers from the kernel heap pool, and the ESP-IDF defaults
# need far more than the ~55 KB actually available. Reduce the buffers to what
# a single-AP captive portal (a few small pages, one client uploading a
# ~50 KB frame every ~250 ms) actually needs.
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=6
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=8
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=8
CONFIG_ESP32_WIFI_AMPDU_TX_ENABLED=n
CONFIG_ESP32_WIFI_AMPDU_RX_ENABLED=n
CONFIG_ESP32_WIFI_MGMT_SBUF_NUM=8

# Make SO_RCVTIMEO/SO_SNDTIMEO effective (used by the /qr_decode body read so
# a stalled upload cannot block the single-threaded HTTP server forever).
CONFIG_NET_CONTEXT_RCVTIMEO=y
