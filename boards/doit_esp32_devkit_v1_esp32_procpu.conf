# Board-specific Kconfig fragment for the classic ESP32 (doit_esp32_devkit_v1/esp32/procpu).
# Merged after prj.conf by the Zephyr build system.

# The classic ESP32 only has ~192 KB of usable app DRAM (dram0_0_seg) and the
# Zephyr + Wi-Fi stack already consumes ~95% of it. The quirc decoder needs at
# least ~17 KB of libc malloc heap (the free RAM between _end and _heap_sentry),
# of which only ~10 KB is left. On-device QR decoding is therefore not feasible
# here: the web page falls back to local (jsQR) decoding.
# RELIC_QR_DECODE_SERVER is opt-in (default n), so it is already off here;
# this line just documents that decision explicitly.
# CONFIG_RELIC_QR_DECODE_SERVER is not set

# Shrink the kernel heap pool to give back RAM to the rest of the system.
CONFIG_HEAP_MEM_POOL_SIZE=16384

# ---------------------------------------------------------------------------
# Static DRAM trimming (Zephyr >= 4.5)
# ---------------------------------------------------------------------------
# The classic ESP32 maps the .noinit section (all thread stacks + the static
# net packet/buf pools and the TCP connection slab) into dram1_0_seg, a tiny
# 93 KB bank (SRAM1 user portion, see soc/espressif/esp32/memory.h:
# CONFIG_ESP32_REGION_1_NOINIT defaults to y). With Zephyr 4.5 those pools
# grew past the bank (~101 KB => linker error "region dram1_0_seg overflowed
# by 5688 bytes"): Wi-Fi selects NET_PKT_LARGE_DEFAULTS, which bumps
# NET_BUF_RX/TX_COUNT to 36, and the tcp_conns slab is sized by
# NET_MAX_CONTEXTS. dram0_0_seg has less than 20 KB free at link time and
# acts as the libc malloc arena, so noinit cannot be moved back there.
# Trim the pools instead; the captive portal is a single-threaded server
# serving one client. 16 x 512 B buffers still cover the 4 KB TCP
# send/receive windows from prj.conf with headroom.
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_NET_MAX_CONN=16

# The image dimension is only used by on-device decoding (disabled above), so
# this value is inert on the V1. Kept for documentation / uniformity.
CONFIG_RELIC_QR_DECODE_MAX_DIM=192
