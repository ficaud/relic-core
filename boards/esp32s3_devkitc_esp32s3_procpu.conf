# Board-specific Kconfig fragment for the ESP32-S3 (esp32s3_devkitc/esp32s3/procpu).
# Merged after prj.conf by the Zephyr build system.

# The ESP32-S3 has ~400 KB of app DRAM. The full 224x224 grayscale image fits
# in the quirc decoder heap (the libc malloc arena, ~66 KB between _end and
# _heap_sentry). RELIC_QR_DECODE_SERVER is opt-in (default n in Kconfig):
# only this board enables on-device decoding.
CONFIG_RELIC_QR_DECODE_SERVER=y
CONFIG_RELIC_QR_DECODE_MAX_DIM=224

# Use ZXing-cpp (QR-only) instead of quirc for on-device decoding. Kept behind
# the backend choice so quirc can be re-enabled for comparison/rollback.
CONFIG_RELIC_QR_DECODE_BACKEND_ZXING=y

# C++ runtime required by ZXing-cpp (the firmware is otherwise C). picolibc is
# already the libc, so the full C++ stdlib (libstdc++) + exceptions are the only
# additions. The classic ESP32 (DevKit V1) does NOT enable this.
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y

# ---------------------------------------------------------------------------
# WiFi RX/TX buffer tuning
# ---------------------------------------------------------------------------
# The ESP32 WiFi driver allocates its buffers with wifi_malloc()/wifi_calloc()
# (esp_adapter.c). With the default CONFIG_ESP_WIFI_HEAP_SYSTEM=y these map to
# k_malloc(), i.e. the kernel heap pool. That pool is ~55 KB here:
#
#   HEAP_MEM_POOL_SIZE (40960) is overridden by the mandatory
#   HEAP_MEM_POOL_ADD_SIZE_ESP_WIFI (51200) + HEAP_MEM_POOL_ADD_SIZE_BOARD
#   (4096) => the real pool is ~55296 B, not 40960 B.
#
# The ESP-IDF default buffer counts (10 static RX + 32 dynamic RX + 32 dynamic
# TX + AMPDU TX/RX BA windows) need far more than 55 KB. Under traffic the
# driver runs out of kernel heap and logs:
#
#   esp32_wifi_adapter: memory allocation failed
#
# stalling the HTTP upload of the grayscale frame, so the QR scan never
# produces a result. Reduce the buffers to what a single-AP captive portal
# (a few small pages, one client uploading a ~50 KB frame every ~250 ms)
# actually needs.
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=6
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=8
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=8
CONFIG_ESP32_WIFI_AMPDU_TX_ENABLED=n
CONFIG_ESP32_WIFI_AMPDU_RX_ENABLED=n
CONFIG_ESP32_WIFI_MGMT_SBUF_NUM=8

# Make SO_RCVTIMEO/SO_SNDTIMEO effective (used by the /qr_decode body read so
# a stalled upload cannot block the single-threaded HTTP server forever).
CONFIG_NET_CONTEXT_RCVTIMEO=y
