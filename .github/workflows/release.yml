# SPDX-License-Identifier: Apache-2.0
#
# Release workflow — Build le firmware et crée une GitHub Release
# avec les artefacts de compilation (zephyr.bin, etc.).

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (ex: v1.0.0)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

jobs:
  build:
    strategy:
      matrix:
        target:
          - board: esp32s3_devkitc/esp32s3/procpu
            artifact: fw-esp32-s3-devkitc-1
          - board: doit_esp32_devkit_v1/esp32/procpu
            artifact: fw-esp32-devkit-v1
          - board: xiao_esp32s3/esp32s3/procpu
            artifact: fw-xiao-esp32s3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/lib/mono /usr/local/julia* /opt/hostedtoolcache
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build devcontainer image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          tags: zephyr-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup West workspace
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspaces/relic-core \
            -w /workspaces/relic-core \
            zephyr-dev:latest \
            bash -c '
              mkdir -p .west &&
              printf "[manifest]\npath = .\nfile = west.yml\n\n[zephyr]\nbase = zephyr\n" > .west/config &&
              west update
            '

      - name: Build firmware (${{ matrix.target.artifact }})
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspaces/relic-core \
            -w /workspaces/relic-core \
            -e XDG_CACHE_HOME=/workspaces/relic-core/build/.cache \
            zephyr-dev:latest \
            bash -c 'mkdir -p /workspaces/relic-core/build/.cache && west build -b ${{ matrix.target.board }} -p always -d build .'

      - name: Prepare release artifact
        run: |
          mkdir -p release-artifacts
          cp build/zephyr/zephyr.bin release-artifacts/${{ matrix.target.artifact }}.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target.artifact }}
          path: release-artifacts/*

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-artifacts
          pattern: fw-*

      - name: Flatten artifacts
        run: |
          mkdir -p flattened
          find release-artifacts -type f \( -name '*.bin' -o -name '*.elf' -o -name '*.map' \) -exec cp {} flattened/ \;

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## How to flash the firmware ${{ steps.version.outputs.tag }}

            1. Open the [web flasher](https://ficaud.github.io/relic-core/flash.html) in Chrome or Edge.
            2. Connect your ESP32 board via USB.
            3. Put the board in download mode:
                * Hold BOOT, tap RESET, release BOOT.
            4. Click Connect & Flash, select the serial port when prompted.
            5. Wait for the progress bar to complete — done!
          files: flattened/*
          draft: false
          generate_release_notes: false

  post-publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Pages workflow
        run: |
          gh workflow run pages.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref }}" \
            -f version="${{ steps.version.outputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Trigger Docker workflow
        run: |
          gh workflow run docker.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref }}" \
            -f version="${{ steps.version.outputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}
