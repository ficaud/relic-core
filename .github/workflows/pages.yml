# SPDX-License-Identifier: GPL-3.0-or-later
#
# Build the WASM demo and deploy to GitHub Pages.

name: Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build the page for (ex: v1.0.0)'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The demo Makefile compiles external/quirc/*.c, which is a git
          # submodule. Recurse so it is present in the CI workspace.
          submodules: recursive

      - name: Build WASM with Emscripten
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            emscripten/emsdk:latest \
            make -C demo clean all

      - name: Prepare Pages artifact
        run: |
          mkdir -p pages/scripts
          cp src/access-point/assets/index.html     pages/
          cp src/access-point/assets/split.html     pages/
          cp src/access-point/assets/unsplit.html   pages/
          cp demo/flash.html                        pages/
          cp src/access-point/assets/style.css      pages/
          cp doc/img/relic-logo_icone.svg         pages/favicon.svg
          cp demo/scripts/sss.js                    pages/scripts/
          cp demo/scripts/sss.wasm                  pages/scripts/
          cp demo/scripts/qr.js                     pages/scripts/
          cp demo/scripts/qr.wasm                   pages/scripts/
          cp demo/scripts/compression.js            pages/scripts/
          cp demo/scripts/compression.wasm          pages/scripts/
          cp demo/scripts/qr_decode.js              pages/scripts/
          cp demo/scripts/qr_decode.wasm            pages/scripts/
          cp src/access-point/assets/scripts/split.js   pages/scripts/
          cp src/access-point/assets/scripts/unsplit.js pages/scripts/
          cp src/access-point/assets/scripts/jsQR.js    pages/scripts/

          # Download firmware binaries from the latest release (same-origin, no CORS)
          echo "Downloading firmware from latest release..."
          RELEASE=$(curl -sL https://api.github.com/repos/ficaud/relic-core/releases/latest)

          URL_S3=$(echo "$RELEASE" | jq -r '.assets[] | select(.name=="fw-esp32-s3-devkitc-1.bin") | .browser_download_url')
          if [ -n "$URL_S3" ]; then
            echo "ESP32-S3: $URL_S3"
            curl -sL --fail -o pages/fw-esp32-s3-devkitc-1.bin "$URL_S3"
          else
            echo "ESP32-S3: no release yet, skipping firmware download"
          fi

          URL_ESP32=$(echo "$RELEASE" | jq -r '.assets[] | select(.name=="fw-esp32-devkit-v1.bin") | .browser_download_url')
          if [ -n "$URL_ESP32" ]; then
            echo "ESP32: $URL_ESP32"
            curl -sL --fail -o pages/fw-esp32-devkit-v1.bin "$URL_ESP32"
          else
            echo "ESP32: no release yet, skipping firmware download"
          fi

          URL_XIAO=$(echo "$RELEASE" | jq -r '.assets[] | select(.name=="fw-xiao-esp32s3.bin") | .browser_download_url')
          if [ -n "$URL_XIAO" ]; then
            echo "XIAO ESP32S3: $URL_XIAO"
            curl -sL --fail -o pages/fw-xiao-esp32s3.bin "$URL_XIAO"
          else
            echo "XIAO ESP32S3: no release yet, skipping firmware download"
          fi

          # Write a tiny manifest for the flash page to read.
          # Prefer the explicitly requested version (from a release dispatch),
          # otherwise fall back to the latest release tag.
          TAG_INPUT="${{ inputs.version }}"
          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
          else
            TAG=$(echo "$RELEASE" | jq -r '.tag_name // "latest"')
          fi
          echo "{\"tag\":\"$TAG\"}" > pages/firmware.json

          ls -la pages/ pages/scripts/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
