#
# nginx configuration for the Relic Core WASM container.
#
# The default nginx config does not serve .wasm files with the correct
# Content-Type. Browsers (Chrome, Firefox, Safari) refuse to instantiate a
# WebAssembly.Module when the server sends a wrong MIME type, so we must
# declare it explicitly.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve .wasm files with the correct MIME type.
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Version manifest — always serve fresh so clients can identify the build.
    location = /version.json {
        add_header Cache-Control "no-cache";
        default_type application/json;
        try_files $uri =404;
    }

    # Static assets — cache aggressively since they are immutable between
    # releases.
    location ~* \.(js|css|svg|png|ico)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # HTML pages — short cache to allow updates.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Everything else falls back to index.html (SPA-style navigation).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS listener: the camera (getUserMedia) requires a secure context, which
# plain HTTP on a LAN IP is not. Serve the same content over TLS using the
# self-signed certificate generated at build time.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/relic-core.crt;
    ssl_certificate_key /etc/nginx/certs/relic-core.key;

    root /usr/share/nginx/html;
    index index.html;

    # Serve .wasm files with the correct MIME type.
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Version manifest — always serve fresh so clients can identify the build.
    location = /version.json {
        add_header Cache-Control "no-cache";
        default_type application/json;
        try_files $uri =404;
    }

    # Static assets — cache aggressively since they are immutable between
    # releases.
    location ~* \.(js|css|svg|png|ico)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # HTML pages — short cache to allow updates.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Everything else falls back to index.html (SPA-style navigation).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

