#
# Relic Core — Docker Compose configuration.
#
# Runs the WASM demo (Shamir's Secret Sharing web UI) in a lightweight
# nginx container. Works on any platform: Linux, macOS, Windows, and
# Raspberry Pi (arm64 / arm/v7).
#
# Usage:
#   docker compose up -d
#   # then open http://localhost:8080  (or https://localhost:8443 for camera access)
#
# To use different ports, override with:
#   RELIC_PORT=9090 RELIC_HTTPS_PORT=9443 docker compose up -d
#
# To identify which version of Relic Core is running, open:
#   http://localhost:8080/version.json
# or inspect the image tag:
#   docker inspect relic-core --format '{{index .Config.Labels "org.opencontainers.image.version"}}'

services:
  relic-core:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        VERSION: ${RELIC_VERSION:-dev}
    image: relic-core-wasm:latest
    container_name: relic-core
    ports:
      - "${RELIC_PORT:-8080}:80"
      - "${RELIC_HTTPS_PORT:-8443}:443"
    restart: unless-stopped

